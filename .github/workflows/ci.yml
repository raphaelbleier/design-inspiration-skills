name: ci
on: [push, pull_request]
jobs:
  studies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/*.test.mjs
      - run: node scripts/studies.mjs
      - name: INDEX.md is up to date
        run: git diff --exit-code skills/design-inspiration/INDEX.md
      - name: Build every rebuild
        run: |
          for d in skills/design-inspiration/studies/*/*/rebuild; do
            [ -d "$d" ] || continue
            (cd "$d" && npm ci && npm run build) || exit 1
          done
