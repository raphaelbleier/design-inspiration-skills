<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Game-changer</title>
  <meta name="description" content="A rally on a blurred court: play a short game of Pong and unlock a fictional collection, one point at a time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2305152d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<template id="logo-tpl">
  <div class="logo" aria-label="Orsa and Velline">
    <svg viewBox="0 0 64 40" aria-hidden="true"><path d="M8 30 L30 8 M16 34 L38 12 M24 38 L46 16" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="50" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="5"/></svg>
    <span>orsa<i>&times;</i>velline</span>
  </div>
</template>

<div id="stage">
  <canvas id="gl"></canvas>
  <div class="ui" id="ui">
    <div class="court-logo" id="courtLogo"></div>
    <canvas id="trail"></canvas>
    <div class="paddle" id="padYou"><i></i></div>
    <div class="paddle" id="padOpp"><i></i></div>
    <div class="ball" id="ball"><b></b><i></i></div>

    <div class="tag tag--opp fx" data-d=".2">Opponent</div>
    <div class="tag tag--you fx" data-d=".2">You</div>
    <div class="score score--opp" id="scoreOpp"></div>
    <div class="score score--you" id="scoreYou"></div>

    <button class="round round--pause" id="btnPause" aria-label="Pause"><svg viewBox="0 0 16 16"><path d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="round round--sound" id="btnSound" aria-label="Sound"><svg viewBox="0 0 16 16" id="icoSound"><path d="M2 8h0M5 5v6M8 3v10M11 5v6M14 8h0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div class="touch" id="touch">
      <button class="key key--sm" id="tA" aria-label="Move left"><svg viewBox="0 0 16 16"><path d="M13 8H3m4-4L3 8l4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="key key--sm" id="tB" aria-label="Move right"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <section class="screen home" id="home">
      <div class="stack">
        <div class="fx" data-d=".25" id="homeLogo"></div>
        <h1 class="title fx" data-d=".36">The Game-<br>changer!</h1>
        <p class="desc fx" data-d=".47">Play the game and unlock the new Orsa &times; Velline court collection with Mara Quill.</p>
        <button class="btn fx" data-d=".58" id="btnStart"><span class="btn__in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 7c5 2 5 8 0 10M20 7c-5 2-5 8 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="lbl">Start</span></span></button>
      </div>
    </section>

    <section class="screen intro" id="intro">
      <div class="step step--players" data-step="0">
        <span class="p p--l">You</span><span class="vs">vs</span><span class="p p--r">Opponent</span>
      </div>
      <div class="step step--text" data-step="1"><p>You are about to play<br>the Game-changer</p></div>
      <div class="step step--text" data-step="2"><p>Score 7 points<br>to win</p></div>
      <div class="step step--controls" data-step="3">
        <p class="ctl ctl--keys"><span>Use the</span><span class="caps"><i class="key"><svg viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i><i class="key"><svg viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i></span><span>to move</span></p>
        <p class="ctl ctl--tap">Tap the arrows<br>to move</p>
      </div>
      <button class="next" id="btnNext"><span class="next__t">Next <svg viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="next__bar"><i></i></span></button>
    </section>

    <div class="count" id="count"></div>

    <button class="next next--reveal" id="btnContinue"><span class="next__t">Click to continue <svg viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="next__bar"><i style="transform:scaleX(1)"></i></span></button>

    <div class="overlay" id="overlay"></div>
    <div class="ghost ghost--you" id="ghostYou">00</div>
    <div class="ghost ghost--opp" id="ghostOpp">00</div>

    <section class="screen modal" id="modal">
      <div class="stack">
        <div class="fx" data-d=".25" id="modalLogo"></div>
        <h2 class="title title--modal fx" data-d=".36" id="mTitle"></h2>
        <p class="desc fx" data-d=".47" id="mDesc"></p>
        <div class="col fx" data-d=".58">
          <button class="btn" id="mPrimary"><span class="btn__in"><span class="lbl" id="mPrimaryT"></span></span></button>
          <button class="ubtn" id="mShare"><svg viewBox="0 0 16 16"><circle cx="4" cy="8" r="1.7"/><circle cx="12" cy="3.7" r="1.7"/><circle cx="12" cy="12.3" r="1.7"/><path d="M4 8l8-4.3M4 8l8 4.3" stroke="currentColor" fill="none"/></svg><span class="sw"><span id="shareA">Share the game</span><span id="shareB">Link copied</span></span></button>
          <button class="ubtn" id="mSecond"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4"/></svg><span id="mSecondT"></span></button>
        </div>
      </div>
    </section>
  </div>
</div>

<div id="preloader">
  <div class="pre-logo" id="preLogo"></div>
  <div class="pre-ball"><span class="pre-shadow"></span><span class="pre-b"></span></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
