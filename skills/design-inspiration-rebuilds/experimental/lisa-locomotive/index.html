<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O.T.T.O — Meridian's Tireless Terminal Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <header class="head">
    <a class="logo" href="#" aria-label="Meridian">Meridian<sup>®</sup></a>
    <svg class="mark" viewBox="0 0 38 16" width="38" height="16" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M2 14 L12 4 M2 4 L12 14 M7 2 V16"/><path d="M18 14 Q24 -2 30 14"/><path d="M28 4 L37 14 M28 14 L37 4 M32 2 V16"/>
      </g>
    </svg>
    <a class="talk" href="#" data-go="project">Let's talk</a>
  </header>
  <main class="lisa" aria-live="polite">
    <div class="dialog" id="dialog"></div>
    <div class="controls" id="controls"></div>
  </main>
  <button class="back" id="back" aria-label="Go back" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H5V3M5 7a8 8 0 1 1 1 9"/></svg>
  </button>
  <button class="sound" id="sound" aria-pressed="false">sound off</button>
  <div class="progress" id="progress"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
