<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oriel Film Foundation</title>
<meta name="description" content="Oriel Film Foundation is a fictional film production house. A clean-room study of an award-level cinema site.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23000'/%3E%3Crect x='2' y='1' width='4' height='6' fill='%23faf7ef'/%3E%3C/svg%3E">
</head>
<body data-page="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- pointed-arch clip used by the About page portraits (objectBoundingBox = scales with the element) -->
  <clipPath id="archClip" clipPathUnits="objectBoundingBox"><path d="M0,1 L0,.34 C0,.16 .34,.07 .5,0 C.66,.07 1,.16 1,.34 L1,1 Z"/></clipPath>
</svg>

<div class="gl" data-gl="c" aria-hidden="true"><canvas></canvas></div>
<div class="grain" aria-hidden="true"></div>

<!-- CSS-only menu state: two hidden checkboxes + :has() in chrome.css, no JS involved. -->
<input type="checkbox" id="menu-toggle" class="sr" aria-label="Menu">
<input type="checkbox" id="list-toggle" class="sr" aria-label="Film list">

<a class="logo" href="#/" aria-label="Oriel Film Foundation, home" data-color="light">
  <span class="logo-main">ORIEL</span><span class="logo-sub">FILM FOUNDATION</span>
</a>

<nav class="nav" data-cursor="hide" aria-label="Main">
  <div class="ticket">
    <span class="ticket-bg"></span>
    <label class="t-left" for="list-toggle">
      <span class="t-film">
        <img class="t-thumb" alt="" width="40" height="40">
        <span class="t-title"></span>
        <svg class="t-chev" viewBox="0 0 12 8" width="12" height="8"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
      <span class="t-talk">
        <svg class="t-mail" viewBox="0 0 40 30" width="40" height="30"><rect x="1.5" y="1.5" width="37" height="27" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3 5l17 13L37 5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
        <span class="t-talk-text"><b>LET'S TALK</b><i>EMAIL US <u><svg viewBox="0 0 16 16" width="8" height="8"><path d="M2 8h11M9 3.5L13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></u></i></span>
      </span>
      <span class="t-meta"><i data-m="a"></i><i data-m="b"></i><i data-m="c"></i></span>
    </label>
    <label class="t-burger" for="menu-toggle" aria-label="Toggle menu"><b></b><b></b><b></b></label>
    <i class="hole hole-t"></i><i class="hole hole-b"></i>
  </div>

  <div class="panel panel-list"><div class="panel-in" id="film-list"></div></div>

  <div class="panel panel-menu"><div class="panel-in">
    <ol class="menu-links">
      <li><a href="#/work" data-hover="bggrow"><em>01</em><span class="tx" style="--d:.1s">WORK</span></a></li>
      <li><a href="#/about" data-hover="bggrow"><em>02</em><span class="tx" style="--d:.2s">ABOUT</span></a></li>
      <li><a href="#/contact" data-hover="bggrow"><em>03</em><span class="tx" style="--d:.3s">CONTACT</span></a></li>
    </ol>
    <div class="menu-row menu-legal"><a href="#/policy">COOKIE</a><a href="#/policy">TERMS</a><a href="#/policy">PRIVACY</a></div>
    <div class="menu-row menu-social" aria-label="Social">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M14 22v-8h3l.5-3.5H14V8.3c0-1 .4-1.8 1.9-1.8h1.7V3.4C17.3 3.3 16.3 3.2 15.2 3.2 12.6 3.2 10.5 4.8 10.5 8v2.5H7.5V14h3v8z" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9h3.4v11H4zM5.7 3.6a2 2 0 110 4 2 2 0 010-4zM10 9h3.2v1.5c.5-.9 1.7-1.8 3.4-1.8 3.4 0 4 2.2 4 5.2V20h-3.4v-5.2c0-1.3 0-2.9-1.8-2.9s-2 1.400-2 2.800V20H10z" fill="currentColor"/></svg>
    </div>
    <div class="menu-row menu-copy">&copy;2024. ORIEL FILM FOUNDATION.</div>
  </div></div>
</nav>

<div class="cursor" aria-hidden="true"><span class="cursor-ring"><span class="cursor-label">SCROLL</span></span></div>

<main id="app" class="app"></main>
<div id="pre" class="pre" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
